openapi: 3.1.2
info:
  title: Components API
  version: 1.0.0
paths: {}
components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
  responses:
    UserResponse:
      description: User response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer }
  examples:
    UserExample:
      summary: User
      value: { id: user-1 }
  requestBodies:
    CreateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
  headers:
    RequestId:
      description: Request identifier
      schema: { type: string }
  securitySchemes:
    ApiKey:
      type: apiKey
      description: API key
      name: X-API-Key
      in: header
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    MutualTls:
      type: mutualTLS
    OAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://example.com/authorize
          refreshUrl: https://example.com/refresh
          scopes:
            users:read: Read users
          x-flow-id: implicit
        password:
          tokenUrl: https://example.com/token
          scopes: {}
        clientCredentials:
          tokenUrl: https://example.com/token
          scopes:
            users:write: Write users
        authorizationCode:
          authorizationUrl: https://example.com/authorize
          tokenUrl: https://example.com/token
          scopes: {}
    OpenId:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    SharedOAuth:
      $ref: "#/components/securitySchemes/OAuth"
  links:
    UserById:
      operationId: getUser
      parameters:
        userId: "$response.body#/id"
  callbacks:
    UserCallback:
      '{$request.body#/callbackUrl}':
        post:
          responses:
            "200": { description: OK }
    SharedCallback:
      $ref: "#/components/callbacks/UserCallback"
  pathItems:
    UserPath:
      summary: User operations
      get:
        responses:
          "200":
            $ref: "#/components/responses/UserResponse"
  x-components-id: shared
